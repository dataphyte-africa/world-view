<div id="worldview-map" style="width:100%;height:{{ mapHeight }};position:relative">
  <div id="map"></div>

  <div id="ui-overlay">
    <div id="top-bar">
      <div class="left">
        <div id="search-container">
          <input type="text" id="search-input" placeholder="Search places or lat,lng..." spellcheck="false">
          <button class="btn" id="btn-search" title="Search"><span class="icon">&#128269;</span></button>
        </div>
      </div>
      <div class="right">
        <div id="stats-pill"></div>
        <button class="btn" id="btn-pin" title="Pin mode"><span class="icon">&#128204;</span> Pin</button>
        <button class="btn" id="btn-heatmap" title="Toggle heatmap"><span class="icon">&#128293;</span> Heat</button>
        <button class="btn" id="btn-legend" title="Legend"><span class="icon">&#8801;</span></button>
      </div>
    </div>

    <div id="legend">
      <div class="section" id="pin-section">
        <h4 style="display:flex;justify-content:space-between;align-items:center">
          <span>&#128204; Pins <span id="pin-count" style="font-weight:400;color:#9aa0a6;font-size:9px"></span></span>
          <button id="btn-clear-pins" style="background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:9px;padding:0">Clear</button>
        </h4>
        <div id="pin-list"></div>
      </div>
    </div>

    <div id="info-panel">
      <button class="close" id="info-close">&times;</button>
      <div class="title" id="info-title">-- <span class="tag" id="info-tag"></span></div>
      <div class="grid" id="info-grid"></div>
    </div>

    <div id="bottom-bar">
      <div class="item" id="b-coords"><span class="val">--</span></div>
      <div class="sep"></div>
      <div class="item">Updated <span class="val" id="b-time">--</span></div>
      <div class="sep"></div>
      <div class="item">All <span class="val" id="b-total">0</span></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
window.WORLDVIEW_CONFIG = {
    aircraftEnabled: {{ aircraftEnabled ? 'true' : 'false' }},
    pinsEnabled: {{ pinsEnabled ? 'true' : 'false' }},
    kmlFeatures: {{ kmlFeatures|json_encode|raw }},
    kmlBounds: {{ kmlBounds|json_encode|raw }},
    pins: {{ pins|json_encode|raw }},
    routePrefix: '{{ routePrefix }}',
    fetchInterval: {{ fetchInterval }},
    maxAircraft: {{ maxAircraft }},
};
</script>
